name: Workforce portal integrity
on:
  pull_request:
    paths:
      - 'assets/js/**'
      - 'ctpa/**'
      - 'employer/**'
      - 'employee/**'
      - 'driver/**'
      - 'owner-operator/**'
      - 'tests/**'
      - '.github/workflows/workforce-portal-integrity.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module tests/five-portal-routing.test.mjs
      - run: node tests/check-local-script-assets.mjs
